[project]
name = "stopmotion"
version = "0.1.0"
description = "Stopmotion capture desktop app driven by an Android phone camera over USB"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stopmotion = "stopmotion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stopmotion*"]
